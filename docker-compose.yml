services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bulkorder
      POSTGRES_USER: bulkorder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkorder -d bulkorder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://bulkorder:${POSTGRES_PASSWORD}@db:5432/bulkorder
      REDIS_URL: redis://redis:6379
      DOWNSTREAM_ORDER_API_URL: ${DOWNSTREAM_ORDER_API_URL:-}
      DOWNSTREAM_ORDER_API_TOKEN: ${DOWNSTREAM_ORDER_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: ["sh","-c","node dist/src/migrate.js && node dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bulkorder:${POSTGRES_PASSWORD}@db:5432/bulkorder
      REDIS_URL: redis://redis:6379
      DOWNSTREAM_ORDER_API_URL: ${DOWNSTREAM_ORDER_API_URL:-}
      DOWNSTREAM_ORDER_API_TOKEN: ${DOWNSTREAM_ORDER_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
